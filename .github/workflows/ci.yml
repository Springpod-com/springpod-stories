name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wes
          POSTGRES_PASSWORD: wes
          POSTGRES_DB: wes_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wes:wes@localhost:5432/wes_dev
      TEST_DATABASE_URL: postgresql://wes:wes@localhost:5432/wes_test
      APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create the test database
        run: PGPASSWORD=wes psql -h localhost -U wes -d wes_dev -c "CREATE DATABASE wes_test"
      - run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Design system drift audit
        run: pnpm audit:ds
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
