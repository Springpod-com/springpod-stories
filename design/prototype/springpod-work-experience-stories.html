<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Springpod Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow submitter column (phone-first) and a wider team console, switched by a top toggle. Tokens from @springpod/design-system 0.2.0 */
:root{
  --bg:#f7fafc; --fg:#16254c; --card:#ffffff; --border:#e0e5ea; --muted:#eef2f6; --muted-fg:#43506f;
  --primary:#16254c; --primary-fg:#ffffff; --teal:#00a5ac; --teal-tint:#cdfffa; --teal-fg:#10707a;
  --accent:#d9e7ff; --accent-fg:#1549f4; --success:#bff3a5; --success-fg:#2e6e0e;
  --warning:#fee3af; --warning-fg:#8c5e03; --danger:#90110c; --danger-tint:#fde4e2; --input:#7a8699; --ring:#10707a;
  --quote-bg:#16254c; --quote-fg:#ffffff; --quote-accent:#18f8f4;
  --rocket-bg:#fdf0c8; --rocket-ink:#16254c; --blue-700:#1549f4;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"IBM Plex Serif",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --r-sm:.25rem; --r:.5rem; --r-xl:.75rem; --r-card:1.5rem; --r-full:9999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f113b; --fg:#f7fafc; --card:#16254c; --border:#2d3a5e; --muted:#2d3a5e; --muted-fg:#cacfd9;
  --primary:#00a5ac; --primary-fg:#0f113b; --teal:#00a5ac; --teal-tint:#10707a; --teal-fg:#cdfffa;
  --accent:#2d3a5e; --accent-fg:#cdfffa; --success:#2a640d; --success-fg:#bff3a5;
  --warning:#8c5e03; --warning-fg:#fee3af; --danger:#ff8a85; --danger-tint:#4a1a2a; --input:#839fb5; --ring:#00a5ac;
  --quote-bg:#00a5ac; --quote-fg:#0f113b; --quote-accent:#0f113b; --rocket-bg:#fcdf8b; --rocket-ink:#0f113b; --blue-700:#71a5ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f113b; --fg:#f7fafc; --card:#16254c; --border:#2d3a5e; --muted:#2d3a5e; --muted-fg:#cacfd9;
  --primary:#00a5ac; --primary-fg:#0f113b; --teal:#00a5ac; --teal-tint:#10707a; --teal-fg:#cdfffa;
  --accent:#2d3a5e; --accent-fg:#cdfffa; --success:#2a640d; --success-fg:#bff3a5;
  --warning:#8c5e03; --warning-fg:#fee3af; --danger:#ff8a85; --danger-tint:#4a1a2a; --input:#839fb5; --ring:#00a5ac;
  --quote-bg:#00a5ac; --quote-fg:#0f113b; --quote-accent:#0f113b; --rocket-bg:#fcdf8b; --rocket-ink:#0f113b; --blue-700:#71a5ff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2;font-weight:600}
p{margin:0}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1100px;margin:0 auto;padding:.7rem 16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:600;letter-spacing:-.01em}
.brand-mark{width:28px;height:28px;border-radius:var(--r);background:var(--teal);display:grid;place-items:center;color:#0f113b;font-weight:700;font-size:15px}
.brand small{font-weight:500;color:var(--muted-fg);font-size:12px;border:1px solid var(--border);border-radius:var(--r-full);padding:.05rem .5rem;margin-left:.2rem}
.seg{display:inline-flex;background:var(--muted);border-radius:var(--r-full);padding:3px}
.seg button{border:0;background:transparent;padding:.4rem .9rem;border-radius:var(--r-full);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted-fg)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(15,17,59,.12)}

.wrap{padding-inline:16px;padding-block:1.75rem 4rem}
.col{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:1.25rem}
.wide{max-width:1100px;margin:0 auto}

.steps{display:flex;gap:.35rem;list-style:none;margin:0;padding:0}
.steps li{flex:1;height:4px;border-radius:var(--r-full);background:var(--border)}
.steps li.on{background:var(--teal)}
.step-label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);font-weight:500}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:1.5rem;display:flex;flex-direction:column;gap:1.1rem}
.panel h1{font-size:28px;letter-spacing:-.5px}
.panel h2{font-size:22px}
.lede{color:var(--muted-fg)}
.field{display:flex;flex-direction:column;gap:.4rem}
.field > label,.field > .lbl{font-weight:500;font-size:14px}
.hint{font-size:13px;color:var(--muted-fg)}
input[type=text],input[type=email],select,textarea{width:100%;border:1px solid var(--input);background:var(--card);border-radius:var(--r-xl);padding:.65rem .8rem}
textarea{min-height:140px;resize:vertical;line-height:1.55}

.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border:1px solid var(--border);background:var(--card);border-radius:var(--r-full);padding:.45rem .9rem;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent-fg);color:var(--accent-fg);font-weight:500}

.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}
@media (max-width:520px){.options{grid-template-columns:1fr}}
.opt{text-align:left;border:1px solid var(--border);background:var(--card);border-radius:var(--r-xl);padding:1rem;cursor:pointer;display:flex;flex-direction:column;gap:.3rem;position:relative}
.opt:hover{border-color:var(--input)}
.opt[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.opt strong{font-weight:600}
.opt span{font-size:13px;color:var(--muted-fg)}
.opt .tag{position:absolute;top:.7rem;right:.7rem;font-size:11px;background:var(--teal-tint);color:var(--teal-fg);border-radius:var(--r-full);padding:.1rem .55rem;font-weight:500}
.opt svg{width:22px;height:22px;stroke:var(--teal-fg)}

.actions{display:flex;gap:.6rem;flex-wrap:wrap;justify-content:space-between;align-items:center}
.btn{border:1px solid transparent;border-radius:var(--r-full);padding:.65rem 1.25rem;font-weight:500;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:.45rem}
.btn-primary{background:var(--primary);color:var(--primary-fg)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--border)}
.btn-teal{background:var(--teal);color:#0f113b}
.btn-sm{padding:.4rem .85rem;font-size:13px}
.btn-danger{background:transparent;border-color:var(--danger);color:var(--danger)}

.notice{border-radius:var(--r-xl);padding:.75rem .9rem;font-size:13.5px;display:flex;gap:.6rem;align-items:flex-start}
.notice.info{background:var(--accent);color:var(--fg)}
.notice.warn{background:var(--warning);color:var(--warning-fg)}
.notice.ok{background:var(--success);color:var(--success-fg)}
.notice.stop{background:var(--danger-tint);color:var(--danger)}

/* interview */
.chat{display:flex;flex-direction:column;gap:.75rem;max-height:440px;overflow-y:auto;padding:.25rem}
.msg{max-width:85%;padding:.7rem .95rem;border-radius:1.1rem;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.ai{background:var(--muted);border-bottom-left-radius:.3rem;align-self:flex-start}
.msg.me{background:var(--primary);color:var(--primary-fg);border-bottom-right-radius:.3rem;align-self:flex-end}
.msg.thinking{color:var(--muted-fg);font-style:italic}
.composer{display:flex;gap:.5rem;align-items:flex-end}
.composer textarea{min-height:52px;height:52px}
.meter{font-family:var(--mono);font-size:12px;color:var(--muted-fg)}

/* upload */
.drop{border:1.5px dashed var(--input);border-radius:var(--r-xl);padding:1.5rem;text-align:center;display:flex;flex-direction:column;gap:.5rem;align-items:center}
.file-pill{display:inline-flex;gap:.5rem;align-items:center;background:var(--teal-tint);color:var(--teal-fg);border-radius:var(--r-full);padding:.3rem .8rem;font-size:13px;font-weight:500}

/* story */
.story-read{font-family:var(--serif);font-size:17px;line-height:1.7}
.story-read p+p{margin-top:.9rem}
input.headline{font-weight:600;font-size:20px}
textarea.story{font-family:var(--serif);font-size:16px;min-height:260px}
.skills{display:flex;flex-wrap:wrap;gap:.4rem}
.skill{background:var(--teal-tint);color:var(--teal-fg);border-radius:var(--r-full);padding:.15rem .65rem;font-size:12.5px;font-weight:500}

/* quote card */
.qcard{background:var(--quote-bg);color:var(--quote-fg);border-radius:var(--r-card);padding:1.6rem;aspect-ratio:4/5;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;gap:1rem;position:relative;overflow:hidden}
.qcard::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid var(--quote-accent);opacity:.25}
.qcard .qmark{font-family:var(--serif);font-size:64px;line-height:.6;color:var(--quote-accent)}
.qcard blockquote{margin:0;font-family:var(--serif);font-size:clamp(18px,4.5vw,24px);line-height:1.35}
.qcard .who{font-size:13px;display:flex;flex-direction:column;gap:.1rem}
.qcard .who b{font-weight:600}
.qcard .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;gap:.5rem;flex-wrap:wrap}
.trust{display:inline-flex;align-items:center;gap:.3rem;border-radius:var(--r-full);padding:.12rem .6rem;font-size:11.5px;font-weight:500;white-space:nowrap}
.trust.verified{background:var(--teal-tint);color:var(--teal-fg)}
.trust.community{background:var(--muted);color:var(--muted-fg)}
.qcard .trust{background:rgba(255,255,255,.16);color:inherit}

.checks{display:flex;flex-direction:column;gap:.5rem;margin:0;padding:0;list-style:none}
.checks label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer}
.checks input{margin-top:.3rem;accent-color:var(--teal-fg);width:16px;height:16px;flex:none}
.radio-row{display:flex;flex-direction:column;gap:.45rem}
.radio-row label{display:flex;gap:.55rem;align-items:center;cursor:pointer}
.radio-row input{accent-color:var(--teal-fg)}

/* team console */
.console{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:1.25rem;align-items:start}
@media (max-width:860px){.console{grid-template-columns:1fr}}
.console-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem}
.console-head h1{font-size:26px}
.stats{display:flex;gap:1.5rem;flex-wrap:wrap}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted-fg)}
.queue{display:flex;flex-direction:column;gap:.5rem}
.qitem{text-align:left;width:100%;border:1px solid var(--border);background:var(--card);border-radius:var(--r-xl);padding:.85rem .95rem;cursor:pointer;display:flex;flex-direction:column;gap:.35rem}
.qitem[aria-current="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.qitem .row{display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.qitem .t{font-weight:600;font-size:14px;line-height:1.3}
.qitem .m{font-size:12px;color:var(--muted-fg)}
.status{font-size:11.5px;font-weight:500;border-radius:var(--r-full);padding:.1rem .55rem;white-space:nowrap}
.status.review{background:var(--warning);color:var(--warning-fg)}
.status.approved{background:var(--success);color:var(--success-fg)}
.status.rejected{background:var(--danger-tint);color:var(--danger)}
.status.changes{background:var(--accent);color:var(--accent-fg)}
.example{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg);border:1px solid var(--border);border-radius:var(--r-full);padding:0 .45rem}
.detail{display:flex;flex-direction:column;gap:1.1rem}
.meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.75rem 1rem}
.meta-grid div{display:flex;flex-direction:column}
.meta-grid dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg)}
.meta-grid dd{margin:0;font-weight:500;font-size:14px}
.flags{display:flex;flex-direction:column;gap:.45rem}
.pack{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem}
@media (max-width:640px){.pack{grid-template-columns:1fr}}
.asset{border:1px solid var(--border);border-radius:var(--r-xl);padding:.9rem;display:flex;flex-direction:column;gap:.5rem;min-width:0}
.asset h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted-fg);font-weight:500;display:flex;justify-content:space-between;align-items:center}
.asset p{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
#err{margin:0}
.copy{border:0;background:transparent;color:var(--accent-fg);cursor:pointer;font-size:12px;font-weight:500;text-transform:none;letter-spacing:0}
.proto-note{font-size:12px;color:var(--muted-fg);border-top:1px dashed var(--border);padding-top:.75rem}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .25s ease-out}@keyframes rise{from{transform:translateY(6px)}to{transform:none}}}
/* one-question-per-screen flow */
.tf{max-width:680px;margin:0 auto;min-height:calc(100vh - 140px);display:flex;flex-direction:column;justify-content:center;padding-block:1rem 5rem}
.tf-q{display:flex;flex-direction:column;gap:1.4rem}
@media (prefers-reduced-motion:no-preference){.tf-q{animation:tfin .32s cubic-bezier(.2,.7,.2,1)}.tf-q.back{animation-name:tfback}
@keyframes tfin{from{transform:translateY(28px);opacity:.2}to{transform:none;opacity:1}}@keyframes tfback{from{transform:translateY(-28px);opacity:.2}to{transform:none;opacity:1}}}
.tf-head{display:flex;gap:.7rem;align-items:baseline}
.tf-num{font-family:var(--mono);font-size:15px;color:var(--teal-fg);white-space:nowrap;display:inline-flex;gap:.25rem;align-items:center}
.tf-title{font-size:clamp(22px,4.2vw,30px);font-weight:500;letter-spacing:-.4px;line-height:1.25}
.tf-sub{color:var(--muted-fg);font-size:16px;margin-top:.4rem;max-width:60ch}
.tf-opts{display:flex;flex-direction:column;gap:.55rem;max-width:460px}
.tf-opts.grid{max-width:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.tf-opts.grid{grid-template-columns:1fr}}
.tf-opt{display:flex;align-items:center;gap:.8rem;text-align:left;border:1px solid var(--teal-fg);background:color-mix(in srgb,var(--teal) 7%,var(--card));border-radius:var(--r);padding:.6rem .8rem;cursor:pointer;font-size:16px;min-height:48px;transition:background .12s}
.tf-opt:hover{background:color-mix(in srgb,var(--teal) 16%,var(--card))}
.tf-opt[aria-pressed="true"]{background:color-mix(in srgb,var(--teal) 24%,var(--card));box-shadow:inset 0 0 0 1px var(--teal-fg)}
.tf-opt .key{flex:none;width:24px;height:24px;border:1px solid var(--teal-fg);border-radius:var(--r-sm);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--teal-fg);background:var(--card)}
.tf-opt[aria-pressed="true"] .key{background:var(--teal-fg);color:var(--card)}
.tf-opt .txt{display:flex;flex-direction:column;flex:1;min-width:0}
.tf-opt .txt small{color:var(--muted-fg);font-size:13px}
.tf-opt .tick{margin-left:auto;color:var(--teal-fg);font-weight:600;visibility:hidden}
.tf-opt[aria-pressed="true"] .tick{visibility:visible}
.tf-opt.big{flex-direction:column;align-items:flex-start;gap:.35rem;padding:1rem}
.tf-opt.big svg{width:24px;height:24px;stroke:var(--teal-fg)}
.tf-opt.big .key{position:absolute;top:.7rem;right:.7rem}
.tf-opt.big{position:relative}
.tf-input{width:100%;border:0;border-bottom:2px solid color-mix(in srgb,var(--teal-fg) 45%,transparent);background:transparent;font-size:clamp(20px,3.6vw,26px);padding:.4rem 0;border-radius:0;color:var(--fg)}
.tf-input:focus{outline:none;border-bottom-color:var(--teal-fg)}
.tf-input::placeholder{color:color-mix(in srgb,var(--muted-fg) 60%,transparent)}
.tf-ok{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.tf-ok .btn{font-size:16px;padding:.6rem 1.3rem;border-radius:var(--r)}
.tf-hint{font-size:12.5px;color:var(--muted-fg)}
.tf-hint b{font-weight:600}
.tf-err{color:var(--danger);font-size:14px;font-weight:500;display:flex;gap:.4rem;align-items:center}
.tf-err::before{content:"!";width:18px;height:18px;border-radius:50%;background:var(--danger);color:var(--card);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.tf-bar{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(.75rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:1rem;pointer-events:none;z-index:5}
.tf-bar > *{pointer-events:auto}
.tf-progress{flex:1;max-width:220px;display:flex;flex-direction:column;gap:.3rem;font-size:12px;color:var(--muted-fg)}
.tf-track{height:4px;background:var(--border);border-radius:var(--r-full);overflow:hidden}
.tf-fill{height:100%;background:var(--teal);transition:width .3s}
.tf-nav{display:flex;gap:2px;border-radius:var(--r);overflow:hidden}
.tf-nav button{border:0;background:var(--primary);color:var(--primary-fg);width:40px;height:36px;cursor:pointer;font-size:16px;display:grid;place-items:center}
.tf-nav button:disabled{opacity:.35;cursor:default}
.tf .chat{max-height:46vh}
.tf textarea.big{font-size:17px;min-height:200px;border:1px solid var(--input);border-radius:var(--r-xl)}
.tf-card{max-width:240px}
/* engagement layer: stepper, rail, rockets, strength meter, toasts, celebration */
.tf-shell{display:grid;grid-template-columns:minmax(0,1fr);gap:2rem;max-width:1100px;margin:0 auto}
@media (min-width:980px){.tf-shell{grid-template-columns:minmax(0,1fr) 304px}}
.tf-rail{display:none}
@media (min-width:980px){.tf-rail{display:flex;flex-direction:column;gap:.9rem;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;margin-top:1.5rem}}
.stepper{display:flex;align-items:center;gap:.4rem;list-style:none;margin:0 0 .5rem;padding:0;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:.45rem;font-size:13px;color:var(--muted-fg)}
.stepper li + li::before{content:"";width:22px;height:2px;background:var(--border);border-radius:2px}
.stepper li.done + li::before{background:var(--teal)}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--border);color:var(--muted-fg);background:var(--card);flex:none}
.stepper li[aria-current="step"]{color:var(--fg);font-weight:500}
.stepper li[aria-current="step"] .dot{border-color:var(--primary);background:var(--primary);color:var(--primary-fg)}
.stepper li.done .dot{border-color:var(--teal);background:var(--teal);color:#0f113b}
@media (max-width:600px){.stepper li:not([aria-current="step"]) .lbl{display:none}}
.rocket-pill{display:inline-flex;align-items:center;gap:.35rem;background:var(--rocket-bg);color:var(--rocket-ink);border-radius:var(--r-full);padding:.25rem .7rem .25rem .5rem;font-family:var(--mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.rocket-pill svg{width:16px;height:16px}
.rocket-pill.bump{animation:bump .45s}
@keyframes bump{30%{transform:scale(1.15)}}
.earned{position:absolute;right:-6px;top:-4px;background:var(--rocket-ink);color:var(--rocket-bg);font-family:var(--mono);font-size:11px;font-weight:600;border-radius:var(--r-full);padding:.05rem .4rem;pointer-events:none;animation:float 1.1s ease-out forwards}
@keyframes float{from{transform:translateY(0);opacity:1}to{transform:translateY(-26px);opacity:0}}

.rail-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-card);padding:1.1rem;display:flex;flex-direction:column;gap:.8rem}

.who-row{display:flex;gap:.7rem;align-items:center}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--teal);color:#0f113b;display:grid;place-items:center;font-weight:600;flex:none;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--teal-tint)}
.avatar.sm{width:30px;height:30px;font-size:13px}
.ghost-line{height:10px;border-radius:var(--r-full);background:var(--muted)}
.rail-chips{display:flex;flex-wrap:wrap;gap:.35rem}
.pill{display:inline-flex;align-items:center;gap:.3rem;border-radius:var(--r-full);padding:.18rem .65rem;font-size:12.5px;font-weight:500;background:var(--accent);color:var(--accent-fg)}

.pill.empty{background:transparent;border:1px dashed var(--border);color:var(--muted-fg);font-weight:400}
.pill.new{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.rail-quote{font-family:var(--serif);font-size:15px;line-height:1.45;color:var(--fg)}
.strength{display:flex;flex-direction:column;gap:.35rem}

.strength .row b{font-weight:600;color:var(--accent-fg)}
.lp{height:8px;background:var(--muted);border-radius:var(--r-full);overflow:hidden}
.lp > i{display:block;height:100%;background:var(--blue-700);border-radius:inherit;transition:width .5s cubic-bezier(.2,.7,.2,1)}

@keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.quick{display:flex;gap:.4rem;flex-wrap:wrap}
.quick button{border:1px solid var(--border);background:var(--card);border-radius:var(--r-full);padding:.3rem .75rem;font-size:13px;cursor:pointer;color:var(--muted-fg)}
.quick button:hover{border-color:var(--teal-fg);color:var(--teal-fg)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){.pill.new,.rocket-pill.bump,.earned,.toast,.typing i{animation:none}}

[hidden]{display:none!important}

/* ===== mobile-first flow (overrides) ===== */

.tf-body{flex:1;display:flex;flex-direction:column}

.tf-opt{min-height:60px;border:1.5px solid var(--border);background:var(--card);border-radius:var(--r-xl);padding:.8rem 1rem;gap:.85rem;font-size:16px;font-weight:500;color:var(--fg);-webkit-tap-highlight-color:transparent;transition:border-color .15s,background .15s,transform .08s}
.tf-opt:hover{background:var(--card);border-color:var(--input)}
.tf-opt:active{transform:scale(.985)}

.mark.sq{border-radius:6px}
.tf-opt[aria-pressed="true"] .mark{border-color:var(--teal-fg);background:var(--teal-fg)}
.tf-opt[aria-pressed="true"] .mark::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.link-btn{align-self:flex-start;border:0;background:transparent;color:var(--accent-fg);font-weight:500;font-size:14px;padding:.5rem 0;cursor:pointer}
.tf-input{font-size:20px;border:1.5px solid var(--input);border-radius:var(--r-xl);padding:.85rem 1rem;background:var(--card)}
.tf-input:focus{border-color:var(--teal-fg);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 25%,transparent)}
.tf-err{font-size:14px}
.cta{position:sticky;bottom:0;margin-top:auto;display:flex;flex-direction:column;gap:.5rem;padding:1rem 0 calc(1rem + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,color-mix(in srgb,var(--bg) 0%,transparent));z-index:3}
.cta.static{position:static;background:none}
.intro{padding-top:1rem}
.btn-block{width:100%;justify-content:center;min-height:54px;font-size:16px;font-weight:600;border-radius:var(--r-xl)}
.tf-card{max-width:220px;align-self:center}
/* intro */
.intro{gap:1.5rem}

/* ===== Springpod design system alignment (springpod-design-system.replit.app) ===== */
:root{--select-bg:#e0e5ea;--select-fg:#43506f;--select-on:#0bb3b7;--select-on-fg:#16254c;--secondary-bg:#e0e5ea;--secondary-border:#cacfd9;--hero:#16254c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--select-bg:#2d3a5e;--select-fg:#cacfd9;--select-on:#00a5ac;--select-on-fg:#0f113b;--secondary-bg:#2d3a5e;--secondary-border:#43506f;--hero:#16254c}
 :root:not([data-theme="light"]) .logo-light{display:none} :root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"]{--select-bg:#2d3a5e;--select-fg:#cacfd9;--select-on:#00a5ac;--select-on-fg:#0f113b;--secondary-bg:#2d3a5e;--secondary-border:#43506f;--hero:#16254c}
:root[data-theme="dark"] .logo-light{display:none} :root[data-theme="dark"] .logo-dark{display:block}
.logo{width:150px;height:auto;display:block}
.logo-dark{display:none}
.brand{gap:.6rem}
.brand-name{font-weight:600;font-size:15px;color:var(--teal-fg);border-left:1px solid var(--border);padding-left:.6rem;line-height:1.2}
/* buttons: 12px radius, 600 weight, 50px */
.btn{border-radius:12px;font-weight:600;min-height:50px;padding:0 24px;font-size:16px}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn-block{min-height:52px;border-radius:12px}
.btn-secondary{background:var(--secondary-bg);color:var(--fg);border:1px solid var(--secondary-border)}
.btn-text{background:transparent;color:var(--fg);border:1px solid transparent}
.btn-text:hover{background:var(--muted)}
.btn-ghost{background:transparent;border:1px solid var(--fg);color:var(--fg)}
.btn-teal{background:#00a5ac;color:#16254c}
.btn-inline{align-self:center;width:auto}
/* form select buttons */
.tf-opt{background:var(--select-bg);color:var(--select-fg);border:1px solid transparent;border-radius:5px;font-weight:400;min-height:56px;padding:16px 20px}
.tf-opt:hover{background:color-mix(in srgb,var(--select-bg) 85%,var(--select-on));border-color:transparent}
.tf-opt[aria-pressed="true"]{background:var(--select-on);color:var(--select-on-fg);border-color:transparent}
.tf-opt .txt{color:inherit}
.tf-opt .txt small{color:inherit;opacity:.85}
.tf-opt[aria-pressed="true"] .txt small{opacity:1}
.tf-opt.tile{font-size:20px;font-weight:300;min-height:74px}
.opt-ic{background:var(--card);border-radius:8px}
.opt-ic svg{stroke:var(--fg)}
.mark{display:none}
.mark.sq{display:grid;border-color:currentColor;opacity:.7}
.tf-opt[aria-pressed="true"] .mark.sq{opacity:1;background:var(--select-on-fg);border-color:var(--select-on-fg)}
.tf-opt[aria-pressed="true"] .mark.sq::after{border-color:var(--select-on)}
/* inputs */
.tf-input{border:1px solid var(--input);border-radius:12px;font-size:18px;padding:.8rem 1rem}
.composer textarea,.tf textarea.big,input[type=text]{border-radius:12px}
/* intro brand hero: all-white logo on Space Cadet */
.intro-hero{background:radial-gradient(120% 90% at 85% 10%,color-mix(in srgb,#00a5ac 35%,var(--hero)) 0%,var(--hero) 60%);border-radius:24px;padding:1.2rem 1.2rem .4rem;display:flex;flex-direction:column;gap:.5rem;overflow:hidden}
.hero-logo{width:150px;height:auto}
.intro-hero .mini-card:not(.back1):not(.back2){background:#ffffff;color:#16254c;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.intro-hero .mini-card .qm{color:#00a5ac}
.intro-hero .mini-card.back2{background:#fac748}
.intro-hero .mini-card.back1{background:#00a5ac}
.intro{padding-top:.5rem}
/* rockets pill uses the brand rocket */
.rocket-pill .rk{height:18px;width:auto;display:block}
.badge-earned .rk{height:40px;width:auto}
.btn.send-btn{width:52px;min-width:52px;height:52px;padding:0;border-radius:12px;justify-content:center}
.btn.send-btn svg{display:block}
.avatar.sm.bot{background:var(--hero);box-shadow:none;padding:5px}
.avatar.sm.bot img{width:100%;height:auto;display:block}
@media (max-width:520px){.brand-name{font-size:14px}}

.brand{text-decoration:none;color:inherit}
.topbar-in{justify-content:space-between}
.admin-link{font-size:14px;font-weight:500;color:var(--accent-fg);text-decoration:none}
.admin-link:hover{text-decoration:underline}
.hero-logo{display:none}

/* media workflow */
.tips{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.85rem}
.tips li{display:flex;gap:.8rem;align-items:flex-start}
.tips b{display:block;font-weight:600;font-size:15px}
.tips small{display:block;color:var(--muted-fg);font-size:13.5px;line-height:1.45}
.tip-ic{width:40px;height:40px;border-radius:12px;background:var(--teal-tint);color:var(--teal-fg);display:grid;place-items:center;flex:none}

.prompt-card{background:var(--hero);color:#ffffff;border-radius:24px;padding:1.2rem 1.25rem;display:flex;flex-direction:column;gap:.6rem}
.pc-label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:#18f8f4;font-weight:500}
.prompt-card ol{margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.35rem;font-size:16px}
.prompt-card p{font-family:var(--serif);font-size:15px;opacity:.95}
.pc-foot{font-size:12.5px;opacity:.75}
.capture{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.cap-tile{display:flex;flex-direction:column;align-items:flex-start;gap:.35rem;padding:1.1rem 1rem;border-radius:12px;background:var(--select-bg);color:var(--select-fg);cursor:pointer;min-height:132px;-webkit-tap-highlight-color:transparent}
.cap-tile svg{width:28px;height:28px;stroke:currentColor}
.cap-tile b{font-size:16px;font-weight:600;color:var(--fg);margin-top:auto}
.cap-tile small{font-size:13px}
.cap-tile.primary{background:var(--select-on);color:var(--select-on-fg)}
.cap-tile.primary b{color:var(--select-on-fg)}
.cap-tile:active{transform:scale(.985)}
.cap-tile:focus-within{outline:2px solid var(--ring);outline-offset:2px}
.mini-tips{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:13.5px;color:var(--muted-fg);background:var(--muted);border-radius:12px;padding:.6rem .85rem}

.checks-list.compact{border-radius:12px}
.chk{display:flex;gap:.75rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--border)}
.chk:last-child{border-bottom:0}
.chk-ic{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;margin-top:1px;background:var(--muted);color:var(--muted-fg)}
.chk.pass .chk-ic{background:var(--success);color:var(--success-fg)}
.chk.warn .chk-ic{background:var(--warning);color:var(--warning-fg)}
.chk.fail .chk-ic{background:var(--danger-tint);color:var(--danger)}

.spin{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:spin .8s linear infinite;margin-right:.5rem;vertical-align:-2px}
.chk-ic .spin{margin:0;color:var(--muted-fg)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
label.btn{display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.review-block{display:flex;flex-direction:column;gap:.6rem;border-top:1px solid var(--border);padding-top:1rem}

.qc-preview{max-width:320px;width:100%;align-self:center}
.quote-pick .tf-opt .txt{font-family:var(--serif);font-size:15.5px}
.tf-card{max-width:300px;width:100%}

.tf-opt.tile.sm{font-size:15px;font-weight:400;min-height:56px;padding:12px 14px;line-height:1.25}
.qc-who .qc-now{color:#18f8f4;font-weight:500}

/* ===== start screen: one Space Cadet box ===== */
.start-box{background:#16254c;color:#ffffff;border-radius:24px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:18px;overflow:hidden;position:relative;
  background-image:radial-gradient(120% 60% at 100% 0%,rgba(0,165,172,.35) 0%,rgba(0,165,172,0) 60%),radial-gradient(90% 50% at 0% 100%,rgba(21,73,244,.25) 0%,rgba(21,73,244,0) 60%)}
.intro{padding-top:.25rem}
.reel{position:relative;padding-top:4px}
.reel-tag{position:absolute;left:0;top:0;z-index:5;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#cdfffa;background:rgba(255,255,255,.1);border-radius:9999px;padding:.25rem .6rem}
.reel-stage{position:relative;height:248px;margin-top:22px;cursor:pointer}
.reel-dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.reel-dots i{width:6px;height:6px;border-radius:9999px;background:rgba(255,255,255,.3);transition:width .3s,background .3s}
.reel-dots i.on{width:18px;background:#18f8f4}
.ex-card{position:absolute;left:50%;top:0;width:min(272px,86%);height:236px;border-radius:20px;overflow:hidden;background:#ffffff;color:#16254c;
  box-shadow:0 18px 40px rgba(0,0,0,.35);transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .7s;will-change:transform}
.ex-card[data-pos="0"]{transform:translateX(-50%) rotate(0) scale(1);opacity:1;z-index:4}
.ex-card[data-pos="1"]{transform:translateX(-38%) rotate(6deg) scale(.92);opacity:.75;z-index:3}
.ex-card[data-pos="2"]{transform:translateX(-50%) rotate(0) scale(.85);opacity:0;z-index:1}
.ex-card[data-pos="-1"]{transform:translateX(-130%) rotate(-10deg) scale(.9);opacity:0;z-index:2}
.ex-card[data-pos="1"] .ex-bar i,.ex-card[data-pos="1"] .bars i{animation-play-state:paused}
.ex-body{height:100%;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ex-chip{align-self:flex-start;display:inline-flex;align-items:center;gap:.3rem;font-size:11.5px;font-weight:600;border-radius:9999px;padding:.22rem .6rem .22rem .45rem;background:#cdfffa;color:#10707a}
.ex-chip svg{width:14px;height:14px;stroke:currentColor}
.ex-who{display:flex;gap:.6rem;align-items:center;margin-top:auto}
.ex-who img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none}
.ex-who b{display:block;font-weight:600;font-size:14px}
.ex-who small{display:block;font-size:12px;color:#43506f;line-height:1.3}
.ex-mark{font-family:var(--serif);font-size:44px;line-height:.5;color:#00a5ac;height:16px}
.ex-q{font-family:var(--serif);font-size:15px;line-height:1.4;color:#16254c;margin:0}
.ex-q.big{font-size:17.5px;line-height:1.35;font-weight:500}
.k-voice .ex-who{margin-top:0}
.ex-wave{display:flex;align-items:center;gap:8px;background:#eef2f6;border-radius:9999px;padding:6px 10px 6px 6px}
.ex-pbtn{width:28px;height:28px;border-radius:50%;background:#16254c;color:#ffffff;display:grid;place-items:center;flex:none}
.bars{flex:1;display:flex;align-items:center;gap:2px;height:26px}
.bars i{flex:1;height:var(--h);background:#00a5ac;border-radius:2px;animation:wave 1.1s ease-in-out infinite;animation-delay:var(--d);transform-origin:center}
@keyframes wave{50%{transform:scaleY(.45)}}
.ex-dur2{font-family:var(--mono);font-size:11.5px;color:#43506f}
.ex-video{position:relative;height:100%;background-size:cover;background-position:center 25%;color:#ffffff;display:flex;flex-direction:column;justify-content:flex-end;padding:14px}
.ex-video::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,17,59,.15) 30%,rgba(15,17,59,.85) 100%)}
.ex-video > *{position:relative}
.ex-video .ex-chip{position:absolute;left:14px;top:14px}
.ex-play{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.92);color:#16254c;display:grid;place-items:center;padding-left:3px}
.ex-sub{margin:0 0 8px;font-size:13.5px;font-weight:500;line-height:1.35;background:rgba(15,17,59,.55);border-radius:8px;padding:.35rem .5rem;align-self:flex-start}
.ex-bar{height:3px;background:rgba(255,255,255,.3);border-radius:9999px;overflow:hidden;margin-bottom:6px}
.ex-bar i{display:block;height:100%;width:0;background:#18f8f4;animation:prog 3.6s linear infinite}
@keyframes prog{to{width:100%}}
.ex-dur{position:absolute;right:14px;top:16px;font-family:var(--mono);font-size:11.5px;background:rgba(15,17,59,.6);border-radius:6px;padding:.1rem .35rem}
.ex-vwho{font-size:12px;opacity:.9}
.ex-vwho b{font-weight:600}
.start-copy{display:flex;flex-direction:column;gap:14px}
.start-title{font-size:clamp(28px,8vw,34px);font-weight:600;letter-spacing:-.8px;line-height:1.12;color:#ffffff;text-wrap:balance}
.start-sub{margin:0;font-size:15.5px;color:#cacfd9}
.start-facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.start-facts li{display:flex;align-items:center;gap:.7rem;font-size:15px;color:#ffffff}
.sf-ic{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.sf-ic svg{width:17px;height:17px;stroke:#18f8f4}
.start-btn{background:#00a5ac;color:#16254c;margin-top:4px}
.start-btn:hover{background:#18c4ca}
@media (prefers-reduced-motion:reduce){.ex-card{transition:none}.bars i,.ex-bar i{animation:none}.ex-bar i{width:35%}}
.brand-name{white-space:nowrap}
@media (max-width:420px){.brand-name{font-size:12.5px;padding-left:.5rem}.brand{gap:.5rem}}

/* single centred column at every width */
.tf-shell{display:block!important;max-width:520px;margin:0 auto}
.tf-rail{display:none!important}
.tf{max-width:520px;margin:0 auto}
.start-box{margin-top:.25rem}

/* ===== layout: header aligned to the form column, content vertically balanced ===== */
body:not(.is-admin) .topbar-in{max-width:552px}
.topbar{box-shadow:0 1px 0 var(--border);border-bottom:0}
.wrap{padding-block:1rem 0}
.tf{min-height:calc(100dvh - 72px);padding-bottom:0}
.tf-body{padding-bottom:.5rem}
@media (min-width:700px){
  body{background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--teal) 10%,var(--bg)) 0%,var(--bg) 70%) fixed,var(--bg)}
  .wrap{padding-block:2.5rem 0}
  .tf{min-height:calc(100dvh - 112px)}
  .tf-q{gap:1.5rem}
  .tf-title{font-size:30px}
  /* start screen: centred in the viewport */
  body.is-intro .tf{justify-content:center;padding-bottom:2.5rem}
  .start-box{padding:28px 28px 28px;gap:22px;box-shadow:0 30px 60px -20px rgba(22,37,76,.45)}
  .reel-stage{height:268px}
  .ex-card{width:300px;height:252px}
  .start-title{font-size:36px}
  /* questions sit in a quiet card on wide screens */
  body:not(.is-intro):not(.is-admin) .tf-body{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 28px 0;box-shadow:0 20px 40px -24px rgba(22,37,76,.25)}
  body:not(.is-intro):not(.is-admin) .cta{margin-left:-28px;margin-right:-28px;padding-left:28px;padding-right:28px;border-radius:0 0 24px 24px;background:linear-gradient(to top,var(--card) 75%,color-mix(in srgb,var(--card) 0%,transparent))}
  body:not(.is-intro):not(.is-admin) .tf-top{padding-inline:4px}
}
@media (max-width:699px){
  .start-box{margin-inline:-4px}
}

@media (min-width:700px){
  body:not(.is-intro):not(.is-admin) .tf{min-height:0;padding-bottom:3rem}
  body:not(.is-intro):not(.is-admin) .tf-body,body:not(.is-intro):not(.is-admin) .tf-q{flex:none}
  body:not(.is-intro):not(.is-admin) .cta{position:static;margin-top:.5rem;background:none}
  body:not(.is-intro):not(.is-admin) .tf .chat{flex:none;max-height:46vh;min-height:220px}
  body.is-intro .tf{min-height:calc(100dvh - 112px)}
}

@media (min-width:700px){
  body:not(.is-intro):not(.is-admin) .tf-body{padding:28px}
  body:not(.is-intro):not(.is-admin) .cta{margin:.5rem 0 0;padding:0}
}

/* ---------- storage: each submitter writes their own record; only the team reads them all ---------- */
let db = null, userCap = null, live = [], unsub = null, isTeam = null;
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch { db = null; }
  try { userCap = window.claude ? await window.claude.use("user") : null; } catch { userCap = null; }
  if (location.hash === "#admin") setTimeout(renderTeam, 0);
})();
async function saveSubmission(item){
  if (!db || !userCap) return false;
  try {
    const uid = await userCap.id(); if (!uid) return false;
    const ref = db.doc("submissions/" + uid);
    const snap = await ref.get();
    const stories = snap.exists ? [...((snap.data() || {}).stories || [])] : [];
    stories.unshift(item);
    await ref.set({ stories: stories.slice(0, 20), updatedAt: new Date().toISOString() });
    return true;
  } catch { return false; }
}
function subscribeTeam(){
  if (!db || unsub) return;
  unsub = db.collection("submissions").onSnapshot(snap => {
    live = snap.docs.flatMap(d => ((d.data() || {}).stories || []).map(x => ({ ...x, _uid: d.id })));
    live.sort((x,y) => String(y.submittedAt||"").localeCompare(String(x.submittedAt||"")));
    if (location.hash === "#admin") renderTeam();
  }, () => {});
}
async function updateItem(it, patch){
  Object.assign(it, patch);
  if (!it._uid || !db) { renderTeam(); return; }
  try {
    const ref = db.doc("submissions/" + it._uid); const snap = await ref.get();
    const stories = ((snap.data() || {}).stories || []).map(x => x.id===it.id ? { ...x, ...patch } : x);
    await ref.update({ stories });
  } catch { renderTeam(); }
}
async function setStatus(it, status){
  it.status = status;
  if (!it._uid || !db) { renderTeam(); return; }
  try {
    const ref = db.doc("submissions/" + it._uid); const snap = await ref.get();
    const stories = ((snap.data() || {}).stories || []).map(x => x.id===it.id ? { ...x, status } : x);
    await ref.update({ stories });
  } catch { renderTeam(); }
}

let idx = 0, dir = 1;
const visible = () => Q.filter(q => !q.when || q.when());
const cur = () => Q[idx];
function stepNo(){ const v = visible().filter(q=>!["intro","stop","done"].includes(q.kind)); return { n: v.indexOf(cur())+1, total: v.length }; }
function nextIdx(from){ for (let i=from+1;i<Q.length;i++){ const q=Q[i]; if(!q.when||q.when()) return i; } return from; }
function prevIdx(from){ for (let i=from-1;i>=0;i--){ const q=Q[i]; if((!q.when||q.when()) && q.kind!=="stop") return i; } return from; }
function goNext(){
  const from = cur();
  if (["choice","text","multi"].includes(from.kind) && from.id!=="intro") award(from.id, 10);
  dir=1; idx = nextIdx(idx);
  const a = chapterOf(from.id), b = chapterOf(cur().id);
  onEnter(); render();
}
function goBack(){ if (idx===0) return; dir=-1; idx = prevIdx(idx); render(); }
function goTo(id){ dir=-1; idx = Q.findIndex(q=>q.id===id); render(); }
function onEnter(){
  const q = cur();
  if (q.kind==="story" && S.format==="interview" && !S.turns.length) startInterview();
  if (q.kind==="draft" && !S.draft) makeDraft();

}
/* One celebration moment, brand colours, skipped for reduced motion */
function confetti(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"); c.hidden = false; const x = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const cols = ["#00a5ac","#1549f4","#fac748","#685bf9","#18f8f4","#16254c"];
  const P = Array.from({length:140}, () => ({ x:W/2, y:H*0.35, vx:(Math.random()-.5)*14, vy:-Math.random()*13-4, r:Math.random()*6+4, c:cols[Math.random()*cols.length|0], a:Math.random()*6, s:(Math.random()-.5)*.3 }));
  let t = 0;
  (function tick(){
    x.clearRect(0,0,W,H); t++;
    P.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.s; x.save(); x.translate(p.x,p.y); x.rotate(p.a); x.fillStyle=p.c; x.globalAlpha=Math.max(0,1-t/150); x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); x.restore(); });
    if (t < 150) requestAnimationFrame(tick); else { x.clearRect(0,0,W,H); c.hidden = true; }
  })();
}

const KIND_LABEL = { video:"Video", voice:"Voice note", written:"Written" };
const KIND_ICON = () => ({ video:ICON.video, voice:ICON.mic, written:ICON.pen });
function exampleCard(e, i){
  const chip = `<span class="ex-chip">${KIND_ICON()[e.kind]}${KIND_LABEL[e.kind]}</span>`;
  const who = `<div class="ex-who"><img src="${PORTRAITS[e.img]}" alt=""><span><b>${e.name}</b><small>${e.meta}</small></span></div>`;
  let body = "";
  if (e.kind === "video") body = `<div class="ex-video" style="background-image:url('${PORTRAITS[e.img]}')">
      ${chip}<span class="ex-play" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span>
      <p class="ex-sub">${e.quote}</p>
      <div class="ex-bar"><i></i></div><span class="ex-dur">${e.dur}</span>
      <div class="ex-vwho"><b>${e.name}</b> · ${e.meta}</div></div>`;
  else if (e.kind === "voice") body = `<div class="ex-body">${chip}${who}
      <div class="ex-wave"><span class="ex-pbtn" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></span><span class="bars">${Array.from({length:28},(_,k)=>`<i style="--h:${20+Math.round(Math.abs(Math.sin(k*1.7+e.img))*80)}%;--d:${(k%7)*0.08}s"></i>`).join("")}</span><span class="ex-dur2">${e.dur}</span></div>
      <p class="ex-q">“${e.quote}”</p></div>`;
  else body = `<div class="ex-body">${chip}<span class="ex-mark">“</span><p class="ex-q big">${e.quote}</p>${who}</div>`;
  return `<article class="ex-card k-${e.kind}" data-i="${i}" data-pos="${i===0?0:i===1?1:i===EXAMPLES.length-1?-1:2}">${body}</article>`;
}
let reelTimer = null, reelIdx = 0;
function startReel(){
  clearInterval(reelTimer);
  const stage = $("#reelStage"); if (!stage) return;
  const cards = [...stage.children], dots = [...$("#reelDots").children], n = cards.length;
  const place = () => cards.forEach((c,i) => { const d = (i - reelIdx + n) % n; c.dataset.pos = d===0 ? 0 : d===1 ? 1 : d===n-1 ? -1 : 2; });
  const step = () => { if (!document.body.contains(stage)) { clearInterval(reelTimer); return; } reelIdx = (reelIdx + 1) % n; place(); dots.forEach((d,i)=>d.classList.toggle("on", i===reelIdx)); };
  place();
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  reelTimer = setInterval(step, 3600);
  stage.onclick = () => { clearInterval(reelTimer); step(); reelTimer = setInterval(step, 3600); };
}
/* FormSelectButton keyboard model: arrows move between answers */
function roving(){
  const opts = [...($("#opts")?.querySelectorAll(".tf-opt")||[])]; if (!opts.length) return;
  opts.forEach(o => o.onkeydown = e => {
    const i = opts.indexOf(o); let j = null;
    if (["ArrowDown","ArrowRight"].includes(e.key)) j = (i+1)%opts.length;
    if (["ArrowUp","ArrowLeft"].includes(e.key)) j = (i-1+opts.length)%opts.length;
    if (e.key==="Home") j=0; if (e.key==="End") j=opts.length-1;
    if (j!==null){ e.preventDefault(); e.stopPropagation(); opts[j].focus(); }
  });
}
/* Live preview that fills in as people answer */
let seen = new Set();
function railHTML(){
  const fresh = k => { const v = !seen.has(k); seen.add(k); return v ? " new" : ""; };
  const chip = (k, val, cls="") => val ? `<span class="pill ${cls}${fresh(k+":"+val)}">${esc(val)}</span>` : `<span class="pill empty">${k}</span>`;
  const nm = first(), ini = nm ? nm.charAt(0).toUpperCase() : "?";
  const words = S.format==="interview" ? wc(S.turns.filter(t=>t.role==="user").map(t=>t.content).join(" ")) : S.format==="write" ? wc(S.written) : S.fileName ? 200 : 0;
  const st = strength();
  return `<div class="rail-card">
      <h3>Your story so far</h3>

async function frameBrightness(meta){
  try {

async function runChecks(file){

    : [["format","File type"],["length","Length"],["size","File size"],["volume","Volume"],["clarity","Clarity"],["silence","Talking time"]];

  if (!isFinite(duration)) R.length = { state:"warn", detail:"We couldn't read the length. We'll check it after you send it." };
  else if (duration < L.minS) R.length = { state:"fail", detail:`${fmtTime(duration)} is a bit short. Aim for at least ${L.minS} seconds so there's enough to share.` };
  else if (duration <= L.maxS) R.length = { state:"pass", detail:`${fmtTime(duration)}. Perfect.` };

let busy = false;
const FALLBACK_Q = [
  () => `Hi ${first()}! What did a normal day look like during your ${S.expType.toLowerCase()}?`,
  () => `Was there one moment that really stood out? Talk me through what happened.`,
  () => `What was harder or different from what you expected?`,

function rules(){
  return `You are the interviewer for Springpod Stories, a UK early careers platform collecting real work experience stories for its website, blog and social channels.
You are interviewing ${first()}, aged ${S.age}, about their ${S.expType}${S.org?` at ${S.org}`:""}, in ${S.role||"an unspecified area"}. They describe themselves as: ${WHO.find(w=>w[0]===S.who)?.[1]}. What they do now: ${nowText()}. If it fits naturally, ask one question near the end about how the experience led to what they do now.
Your job: draw out a vivid, specific, first-person story.
Rules:
- Ask ONE short question at a time, 25 words or fewer. Warm, plain British English. No emojis, no em dashes, no jargon, no gushing praise.
- Cover these in a natural order: what they did day to day; one specific moment that stood out; something hard or surprising; a skill they used or built (with an example); how it changed their view of their future; advice for someone like them.
- If an answer is vague or one line, ask one follow-up for a concrete example before moving on. Briefly acknowledge what they said (a few words) before the next question.
- Never ask for surnames, school names, addresses, phone numbers, social handles or contact details. If they share any, do not repeat it.
- If they describe anything that suggests they were unsafe, harmed or treated badly, respond kindly, suggest they talk to a trusted adult or the organiser, and end the interview.
- After 6 to 8 questions, or once you have enough for a strong story, thank them in one sentence and end your message with [[END]].
Reply with only your next message to ${first()}.`;
}
async function startInterview(){ await askNext(); }
async function askNext(){
  busy = true; if (cur().kind==="story") render();
  let text = "";
  const userTurns = S.turns.filter(t=>t.role==="user").length;
  if (sample) {
    try {
      const r = await sample([{role:"user",content:rules()+"\n\nStart the interview now with a short hello and your first question."}, ...S.turns], {
        modelTier:"quick", cache:false,
        onText: ({text:t}) => { const b=$("#pending"); if(!b) return; b.classList.remove("thinking"); b.textContent = t.replace("[[END]]","").trim(); const c=$("#chat"); c && (c.scrollTop=c.scrollHeight); }
      });
      text = r.text;
    } catch(e) {
      if (e && ["not_granted","sampling_disabled","not_declared"].includes(e.code)) sample = null;
      text = "";
    }
  }
  if (!text) { const q = FALLBACK_Q[userTurns]; text = q ? q() : `Thanks ${first()}, that's brilliant. I've got everything I need. [[END]]`; }
  if (text.includes("[[END]]") || userTurns>=9) S.ended = true;
  S.turns.push({role:"assistant", content:text.replace("[[END]]","").trim()});
  S.qCount = S.turns.filter(t=>t.role==="user").length;
  busy = false;
  if (cur().kind==="story") render();
}

async function makeDraft(){

About the person: ${first()}, ${S.age}, ${WHO.find(w=>w[0]===S.who)?.[1]}. Experience: ${S.expType}${S.org?` at ${S.org}`:""}, ${S.role}. What they do now: ${nowText()}. If they say how the experience shaped what they do now, end the story on that link.
Rules: write in their voice using their own words and details where possible; do not invent facts, names or numbers; British English; plain and honest, not salesy; no em dashes; no emojis; remove any surnames, school names or contact details; 180 to 280 words in 3 or 4 short paragraphs.${S.prevDraft?" Take a noticeably different angle and opening from this previous version: "+S.prevDraft.headline:""}
Reply with only JSON: {"headline": string (max 10 words, specific, not clickbait), "story": string (paragraphs separated by \\n\\n), "quoteOptions": [3 different strings, each 8 to 20 words, close to their own words, each about a specific moment, feeling, surprise or lesson. Never a summary of what, where or when (no "I did X work experience in year 10"). Pick lines a student would stop scrolling for], "pullQuote": string (the strongest of quoteOptions), "skills": [up to 4 short skill names], "advice": string (one sentence, their advice), "sector": string}

${sourceText().slice(0,12000)}`;

/* Score sentences: reward moments, feelings and lessons; penalise "what/when" summaries */
function pickQuotes(raw){
  const sents = String(raw).replace(/\s+/g," ").split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>=35 && x.length<=150);
  const good = /\b(best|moment|felt|feel|realised|realized|learn|learned|learnt|surprised|nervous|proud|scary|hardest|favourite|clicked|confidence|never|first time|actually)\b/i;
  const bad = /\b(year \d+|work experience (at|in|with)|i did (my|a|some)|my name is)\b/i;
  const scored = sents.map(x => ({ x, sc: (good.test(x)?3:0) - (bad.test(x)?3:0) + (/\b(i|me|my)\b/i.test(x)?1:0) - Math.abs(x.length-90)/60 }));
  scored.sort((a,b)=>b.sc-a.sc);
  const out = scored.slice(0,3).map(o=>o.x);
  return out.length ? out : [String(raw).slice(0,120)];
}
function fallbackDraft(){
  const raw = S.format==="interview" ? S.turns.filter(t=>t.role==="user").map(t=>t.content).join("\n\n") : (S.format==="write"?S.written:S.transcript);
  const opts = pickQuotes(raw);
  return { headline:`My ${S.expType.toLowerCase()} in ${S.role||"a new team"}`, story:raw, pullQuote:opts[0], quoteOptions:opts, skills:["Communication","Confidence"], advice:"Say yes to things and ask questions.", sector:S.role };
}

    headline:d.headline, pullQuote:d.pullQuote, story:d.story, skills:d.skills, channels:ch, marketing:S.consent.marketing };
  item.submittedAt = new Date().toISOString();
  item.now = { status:(NOW_OPTS.find(o=>o[0]===S.nowStatus)||[,""])[1], role:S.nowRole.trim(), company:S.nowCo.trim(), industry:S.nowInd, showCompany:!!S.consent.showCo };
  item.media = S.media && (S.format==="voice"||S.format==="video") ? { kind:S.format, duration:isFinite(S.media.meta.duration)?Math.round(S.media.meta.duration):null, w:S.media.meta.w||0, h:S.media.meta.h||0, checks:S.media.checks.map(({id,label,state,detail})=>({id,label,state,detail})) } : null;
  item.review = {};
  localItems.unshift(item); selected = item.id;
  saveSubmission(item);
}
var localItems = [];
const STATUS = { review:"In review", approved:"Approved", rejected:"Rejected", changes:"Changes requested" };
const CH_NAME = { platform:"Springpod", website:"Website", blog:"Blog", social:"Social" };

function flags(it){
  const f = [];
  if (it.parent==="Pending") f.push(["warn","Parent or carer consent pending. Can't publish until received."]);
  if (it.parent==="Agreed") f.push(["ok","Parent or carer consent received."]);
  if (it.org) f.push(["info",`Names ${it.org}. Partner approval needed before use on their channels; check tone is fair.`]);
  if (it.trust==="community") f.push(["info","Community story. Not matched to a Springpod record, so label it as such."]);
  if (it.trust==="verified") f.push(["ok","Matched to a completed Springpod programme."]);
  if (/\b(school|academy|college)\b/i.test(it.story) && it.age==="14 to 17") f.push(["warn","Mentions a school or college. Check it doesn't identify them."]);
  if (/\d{5,}|@\w|\b[A-Z][a-z]+ [A-Z][a-z]+ (School|Academy)\b/.test(it.story)) f.push(["stop","Possible personal details found. Remove before approving."]);
  if (!f.some(x=>x[0]==="stop")) f.push(["ok","Automated check: no contact details or harmful content found."]);
  return f;
}
async function renderTeam(){
  if (userCap && isTeam === null) { try { isTeam = await userCap.canEdit(); } catch { isTeam = false; } }
  if (userCap && isTeam === false) {
    $("#team").innerHTML = `<div class="panel" style="max-width:520px;margin:3rem auto"><h1 style="font-size:24px">This area is for the Springpod team</h1><p class="lede">You need editor access to review stories.</p><a class="btn btn-primary" href="#" style="align-self:flex-start;text-decoration:none">Go to the story form</a></div>`;
    return;
  }
  subscribeTeam();
  const seenIds = new Set();
  const LIST = [...live, ...localItems, ...QUEUE].filter(x => !seenIds.has(x.id) && seenIds.add(x.id));
  const it = LIST.find(q=>q.id===selected) || LIST[0];
  const counts = { review:LIST.filter(q=>q.status==="review").length, approved:LIST.filter(q=>q.status==="approved").length };
  $("#team").innerHTML = `
    <div class="console-head">
      <div style="display:flex;flex-direction:column;gap:.3rem"><span class="step-label">Springpod Stories admin</span><h1>Story queue</h1></div>
      <div class="stats"><div class="stat"><b>${counts.review}</b><span>To review</span></div><div class="stat"><b>${counts.approved}</b><span>Approved</span></div><div class="stat"><b>${LIST.length}</b><span>Total</span></div></div>
    </div>
    <div class="console">
      <div class="queue" id="queue">${LIST.map(q=>`<button class="qitem" data-id="${q.id}" aria-current="${q.id===it.id}">
        <div class="row"><span class="status ${q.status}">${STATUS[q.status]}</span>${q.example?`<span class="example">Example</span>`:`<span class="m">${q.submittedAt?new Date(q.submittedAt).toLocaleDateString("en-GB",{day:"numeric",month:"short"}):""}</span>`}</div>
        <span class="t">${esc(q.headline)}</span>
        <span class="m">${esc(q.name)} · ${esc(q.type)} · ${esc(q.format)}</span></button>`).join("")}</div>
      <div class="panel detail">
        <div style="display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;align-items:center">
          <span class="trust ${it.trust}">${trustLabel(it.trust)}</span><span class="status ${it.status}">${STATUS[it.status]}</span></div>
        <h2>${esc(it.headline)}</h2>
        <dl class="meta-grid">
          <div><dt>Name shown</dt><dd>${esc(it.name)}</dd></div>
          <div><dt>Age</dt><dd>${esc(it.age)}</dd></div>
          <div><dt>Experience</dt><dd>${esc(it.type)}</dd></div>
          <div><dt>Organisation</dt><dd>${esc(it.org||"Not named")}</dd></div>
          <div><dt>Area</dt><dd>${esc(it.role)}</dd></div>
          <div><dt>Now</dt><dd>${it.now ? esc([it.now.role||it.now.status, it.now.company?(it.now.company+(it.now.showCompany?"":" (not public)")):"", it.now.industry].filter(Boolean).join(" · ")) : "Not given"}</dd></div>
          <div><dt>Submitted as</dt><dd>${esc(it.format)}</dd></div>
          <div><dt>Can appear on</dt><dd>${it.channels.map(c=>CH_NAME[c]).join(", ")||"Nowhere"}</dd></div>
          <div><dt>Parent consent</dt><dd>${esc(it.parent)}</dd></div>
        </dl>
        <div class="flags">${flags(it).map(([k,t])=>`<div class="notice ${k}">${esc(t)}</div>`).join("")}</div>
        <div class="story-read">${it.story.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
        <div class="skills">${it.skills.map(s=>`<span class="skill">${esc(s)}</span>`).join("")}</div>
        ${mediaReviewHTML(it)}
        <div class="actions" style="justify-content:flex-start">
          <button class="btn btn-primary btn-sm" data-act="approved" ${it.parent==="Pending"?"disabled title='Waiting for parent consent'":it.media && (TEAM_CHECKS[it.media.kind]||[]).some((_,i)=>!(it.review||{})[i])?"disabled title='Complete the team checks first'":""}>Approve</button>
          <button class="btn btn-ghost btn-sm" data-act="changes">Request changes</button>
          <button class="btn btn-danger btn-sm" data-act="rejected">Reject</button>
        </div>
        <div style="display:flex;flex-direction:column;gap:.8rem;border-top:1px solid var(--border);padding-top:1.1rem">
          <div class="actions"><h3 style="font-size:17px">Content pack</h3><button class="btn btn-teal btn-sm" id="genpack">${PACKS[it.id]?"Regenerate":"Generate content pack"}</button></div>
          <div id="pack">${packHTML(it)}</div>
        </div>

      </div>
    </div>`;
  $("#queue").onclick = e => { const b=e.target.closest(".qitem"); if(!b) return; selected=b.dataset.id; renderTeam(); };
  $("#team").querySelectorAll("[data-act]").forEach(b => b.onclick = () => setStatus(it, b.dataset.act));
  const tc = $("#teamchk"); if (tc) tc.onchange = e => { const i = e.target.dataset.i; updateItem(it, { review: { ...(it.review||{}), [i]: e.target.checked } }); };
  $("#genpack").onclick = () => genPack(it);
  bindCopies();
}
function packHTML(it){
  const p = PACKS[it.id];
  const card = `<div style="max-width:300px">${quoteCard(it.pullQuote, it.name, `${it.type}${it.role?" · "+it.role:""}`, it.trust)}</div>`;
  if (!p) return `<div class="pack"><div>${card}</div><div class="asset"><h4>What you'll get</h4><p>A LinkedIn post, an Instagram caption, a TikTok or Reels hook with a shot list, a blog title and intro, and SEO tags. Only for the channels this person agreed to.</p></div></div>`;
  if (p==="loading") return `<div class="pack"><div>${card}</div><div class="asset"><h4>Writing</h4><p class="msg ai thinking" style="max-width:none">Drafting assets…</p></div></div>`;
  const a = [];
  if (it.channels.includes("social")) { a.push(["LinkedIn post",p.linkedin]); a.push(["Instagram caption",p.instagram]); a.push(["Short video hook and shots",p.video]); }
  if (it.channels.includes("blog")) a.push(["Blog title and intro",(p.blogTitle||"")+"\n\n"+(p.blogIntro||"")]);
  if (it.channels.includes("website")||it.channels.includes("platform")) a.push(["Website snippet",p.snippet]);
  a.push(["Tags",(p.tags||[]).join(", ")]);
  return `<div class="pack"><div style="display:flex;flex-direction:column;gap:1rem">${card}${a.slice(0,1).map(asset).join("")}</div><div style="display:flex;flex-direction:column;gap:1rem">${a.slice(1).map(asset).join("")}</div></div>`;
}
function asset([t,body]){ return `<div class="asset"><h4>${esc(t)}<button class="copy">Copy</button></h4><p>${esc(body||"")}</p></div>`; }
function bindCopies(){
  $("#team").querySelectorAll(".copy").forEach(b => b.onclick = async () => {
    const txt = b.closest(".asset").querySelector("p").textContent;
    try { await navigator.clipboard.writeText(txt); b.textContent="Copied"; } catch { const r=document.createRange(); r.selectNodeContents(b.closest(".asset").querySelector("p")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent="Selected"; }
    setTimeout(()=>b.textContent="Copy",1500);
  });
}
async function genPack(it){
  PACKS[it.id] = "loading"; $("#pack").innerHTML = packHTML(it);
  const prompt = `You write social and web content for Springpod, a UK early careers platform for 14 to 24 year olds. Create a content pack from this work experience story.
Rules: British English. Plain, warm, specific. No em dashes. No hashtag spam (max 3 hashtags, LinkedIn and Instagram only). No emojis except at most one in the Instagram caption. Never invent facts beyond the story. Refer to the person only as "${it.name}". ${it.org?`The organisation is ${it.org}; mention it factually.`:""} Label it as a ${it.trust==="verified"?"Springpod programme":"community"} story where relevant.
Reply with only JSON: {"linkedin": string (80 to 130 words), "instagram": string (40 to 70 words), "video": string (a 1-line hook for TikTok or Reels, then 4 numbered shots on new lines), "blogTitle": string, "blogIntro": string (50 to 80 words), "snippet": string (one sentence for a programme page), "tags": [5 lowercase topic tags]}

Headline: ${it.headline}
Experience: ${it.type}, ${it.role}${it.org?", "+it.org:""}
Story:
${it.story}`;
  let p = null;
  if (sample) { try { p = await sample.json(prompt, {cache:false}); } catch { p = null; } }
  if (!p || !p.linkedin) p = {
    linkedin:`"${it.pullQuote}"\n\n${it.name} shared what their ${it.type.toLowerCase()} in ${it.role.toLowerCase()} was really like. ${it.story.split("\n\n")[0]}\n\nRead the full story on Springpod.`,
    instagram:`"${it.pullQuote}" ${it.name} on their ${it.type.toLowerCase()}. Full story at the link in bio.`,
    video:`Hook: "${it.pullQuote.split(".")[0]}."\n1. Face to camera, first day nerves\n2. The task they were given\n3. The moment it clicked\n4. Their advice, on screen text`,
    blogTitle:it.headline, blogIntro:it.story.split("\n\n").slice(0,2).join(" "), snippet:`"${it.pullQuote}" ${it.name}, ${it.type}.`,
    tags:[it.role.toLowerCase(), it.type.toLowerCase(), "work experience", "early careers", "student stories"] };
  PACKS[it.id] = p;
  if (!$("#team").hidden && selected===it.id) renderTeam();
}

route();
})();
</script>
